[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "metriq-qudits"
version = "0.1.0"
description = "ECD compilation and simulation toolkit for qudit benchmarks"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12,<3.14"
dependencies = [
    "dynamiqs==0.3.4",
    "jax==0.6.2",
    "matplotlib==3.11.1",
    "numpy==2.5.1",
    "qutip==5.3.0",
    "scipy==1.18.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
metriq-qudits = "metriq_qudits.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: end-to-end test that runs the real JAX optimizer (deselected unless --slow is given)",
]
